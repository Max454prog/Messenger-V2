<script>
"use strict";
/* Слои: Store (состояние) ← Auth и Chats (логика без DOM) ← View-классы (DOM) ← App (сборка).
   Опубликованная страница не может ходить на внешние серверы, поэтому данные лежат в localStorage:
   чат работает между аккаунтами одного браузера (сессия у каждой вкладки своя). */
const KEY = "iskra:v1";
const BOT = Object.freeze({ id: "bot", name: "Искра-бот", status: "всегда на связи ⚡" });
const STATUS_PRESETS = ["⚡ На связи", "🚗 В пути", "🔕 Не беспокоить", "😴 Сплю"];
const SAFE_IMG = /^data:image\/jpeg;base64,[\w+/=]+$/;
const LOGO = '<svg viewBox="0 0 64 64"><g fill="#111"><circle cx="22" cy="34" r="10"/><circle cx="34" cy="28" r="13"/><circle cx="46" cy="35" r="9"/><rect x="22" y="34" width="24" height="10"/></g><path d="M35 30 26 45h7l-3 12 12-17h-7l4-10z" fill="#ffc107" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>';

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const time = (ts) => new Date(ts).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
/* Чистый JS вместо crypto.subtle: тот недоступен вне https (например, при открытии файла на телефоне), и регистрация падала бы. */
const sha256 = (text) => {
  const primes = [];
  for (let n = 2; primes.length < 64; n++) if (primes.every((p) => n % p)) primes.push(n);
  const frac = (x) => Math.floor((x - Math.floor(x)) * 2 ** 32);
  const K = primes.map((p) => frac(Math.cbrt(p)));
  let H = primes.slice(0, 8).map((p) => frac(Math.sqrt(p)));
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  const bytes = [...new TextEncoder().encode(text)], bitLength = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let shift = 56; shift >= 0; shift -= 8) bytes.push(Math.floor(bitLength / 2 ** shift) & 0xff);
  for (let off = 0; off < bytes.length; off += 64) {
    const w = [];
    for (let i = 0; i < 16; i++) w[i] = (bytes[off + 4 * i] << 24) | (bytes[off + 4 * i + 1] << 16) | (bytes[off + 4 * i + 2] << 8) | bytes[off + 4 * i + 3];
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, hh] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (hh + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      [hh, g, f, e, d, c, b, a] = [g, f, e, (d + t1) | 0, c, b, a, (t1 + t2) | 0];
    }
    H = H.map((v, i) => (v + [a, b, c, d, e, f, g, hh][i]) | 0);
  }
  return H.map((v) => (v >>> 0).toString(16).padStart(8, "0")).join("");
};
const h = (tag, props = {}, ...kids) => { const node = Object.assign(document.createElement(tag), props); node.append(...kids); return node; };
const field = (value, placeholder, type = "text") => h("input", { className: "in", value, placeholder, type, autocomplete: "off" });
const readFile = (file) => new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => fail(new Error("Не удалось прочитать файл")); r.readAsDataURL(file); });

/* Квадратная миниатюра хранится как data-URL: так localStorage не переполняется оригиналами фото. */
const readAvatar = async (file) => {
  const img = h("img");
  await new Promise((ok, fail) => { img.onload = ok; img.onerror = () => fail(new Error("Это не изображение")); readFile(file).then((src) => { img.src = src; }, fail); });
  const side = Math.min(img.width, img.height), canvas = h("canvas", { width: 128, height: 128 });
  canvas.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 128, 128);
  return canvas.toDataURL("image/jpeg", 0.8);
};

const avatar = (u, size = 44) => {
  const node = h("div", { className: "av" });
  node.style.width = node.style.height = size + "px";
  node.style.fontSize = size / 2.4 + "px";
  if (u.id === BOT.id) { node.classList.add("bot"); node.innerHTML = LOGO; }
  else if (SAFE_IMG.test(u.avatar || "")) node.style.backgroundImage = `url(${u.avatar})`;
  else {
    node.textContent = (u.name.trim()[0] || "?").toUpperCase();
    node.style.background = `hsl(${[...u.name].reduce((a, c) => a + c.charCodeAt(0), 0) % 360} 55% 45%)`;
  }
  return node;
};

class LocalBackend {
  read() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
  /* Из файла на телефоне браузер часто запрещает localStorage: без проверки аккаунт «создался» бы и пропал после перезагрузки. */
  get persistent() { try { localStorage.setItem(KEY + ":probe", "1"); localStorage.removeItem(KEY + ":probe"); return true; } catch { return false; } }
  write(state) { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* приватный режим или квота: остаёмся в памяти */ } }
}                                                   
class FirebaseBackend {
  constructor() {
    this.ready = new Promise((resolve) => {
      if (window.__fb) return resolve(window.__fb);
      addEventListener("firebase-ready", () => resolve(window.__fb), { once: true });
      setTimeout(() => resolve(window.__fb || null), 3000);
    });
  }
  
  async getFb() {
    const fb = await this.ready;
    if (!fb) throw new Error("Firebase не подключён");
    return fb;
  }

  async pushMsg(msg) {
    const fb = await this.getFb();
    await fb.set(fb.ref(fb.db, `msgs/${msg.id}`), msg);
  }

  async markSeen(msgId, byUser) {
    const fb = await this.getFb();
    await fb.update(fb.ref(fb.db, `msgs/${msgId}`), { seen: true, seenBy: byUser });
  }

  async listenMsgs(onMsg) {
    const fb = await this.getFb();
    fb.onChildAdded(fb.ref(fb.db, "msgs"), (snap) => onMsg(snap.val()));
  }

  async setPresence(uid, online) {
    const fb = await this.getFb();
    const r = fb.ref(fb.db, `presence/${uid}`);
    await fb.set(r, { online, ts: Date.now() });
    if (online) fb.onDisconnect(r).set({ online: false, ts: Date.now() });
  }
}
class MemoryBackend {
  constructor() { this.state = null; }
  read() { return this.state && structuredClone(this.state); }
  write(state) { this.state = structuredClone(state); }
}

class Store {
  constructor(backend) { this.backend = backend; this.load(); }
  load() { this.s = this.backend.read() || this.s || { users: {}, msgs: [], session: null }; }
  get persistent() { return this.backend.persistent !== false; }
  /* Перед каждой записью перечитываем хранилище, чтобы не затереть сообщения из соседней вкладки. */
  update(mutate) { this.load(); mutate(this.s); this.backend.write(this.s); }
}

class DateFormat {
  static daysAgo(ts) { const day = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()); return Math.round((day(new Date()) - day(new Date(ts))) / 864e5); }
  static day(ts) {
    const ago = DateFormat.daysAgo(ts);
    if (ago === 0) return "Сегодня";
    if (ago === 1) return "Вчера";
    const sameYear = new Date(ts).getFullYear() === new Date().getFullYear();
    return new Date(ts).toLocaleDateString("ru-RU", { day: "numeric", month: "long", ...(sameYear ? {} : { year: "numeric" }) });
  }
  static short(ts) {
    const ago = DateFormat.daysAgo(ts);
    return ago === 0 ? time(ts) : ago === 1 ? "Вчера" : new Date(ts).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
  }
}

/* Тема общая для устройства; корневой элемент передаётся снаружи, чтобы класс проверялся без DOM. */
class Theme {
  static MODES = [["light", "Светлая", "sun"], ["dark", "Тёмная", "moon"], ["auto", "Авто", "auto"]];
  constructor(store) { this.store = store; }
  get mode() { return this.store.s.theme || "auto"; }
  set(mode, root) { this.store.update((s) => { s.theme = mode; }); this.apply(root); }
  apply(root = document.documentElement) {
    if (this.mode === "auto") root.removeAttribute("data-theme"); else root.dataset.theme = this.mode;
  }
}

class Validator {
  /* В России номер часто вводят как 8 900… вместо +7 900…: приводим к одному виду, иначе вход по другому написанию не находит аккаунт. */
  static digits(v) { const d = v.replace(/\D/g, ""); return d.length === 11 && d[0] === "8" ? "7" + d.slice(1) : d; }
  static name(v) { const n = v.trim().length; return n >= 2 && n <= 24 ? "" : "Имя: от 2 до 24 символов"; }
  static phone(v) { return /^\d{10,15}$/.test(Validator.digits(v)) ? "" : "Номер: от 10 до 15 цифр"; }
  static email(v) { const e = v.trim(); return !e || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e) ? "" : "Почта: проверьте формат, например name@mail.ru"; }
  static password(v) { return v.length >= 6 ? "" : "Пароль: минимум 6 символов"; }
}

class Auth {
  constructor(store) { this.store = store; this.userId = store.s.session; }
  get user() { return this.store.s.users[this.userId] || null; }
  findByPhone(phone) { return Object.values(this.store.s.users).find((u) => Validator.digits(u.phone) === Validator.digits(phone)); }
  assertValid(...errors) { const first = errors.find(Boolean); if (first) throw new Error(first); }
  conflict(s, { phone, email }, selfId) {
    const others = Object.values(s.users).filter((u) => u.id !== selfId);
    if (others.some((u) => Validator.digits(u.phone) === phone)) return "Этот номер уже зарегистрирован";
    if (email && others.some((u) => u.email === email)) return "Эта почта уже занята";
    return "";
  }

  async register({ name, phone, email = "", password }) {
    this.assertValid(Validator.name(name), Validator.phone(phone), Validator.email(email), Validator.password(password));
    const salt = uid();
    const user = { id: uid(), name: name.trim(), phone: Validator.digits(phone), email: email.trim().toLowerCase(), salt, hash: await sha256(salt + password), status: STATUS_PRESETS[0], avatar: null };
    this.store.update((s) => {
      this.assertValid(this.conflict(s, user));
      s.users[user.id] = user;
      s.session = user.id;
    });
    this.userId = user.id;
    return user;
  }
  async login(phone, password) {
    this.store.load();
    const user = this.findByPhone(phone);
    if (!user || user.hash !== await sha256(user.salt + password)) throw new Error("Неверный номер или пароль");
    this.store.update((s) => { s.session = user.id; });
    this.userId = user.id;
    return user;
  }
  logout() { this.store.update((s) => { s.session = null; }); this.userId = null; }
  update({ name, phone, email = "", status, avatar }) {
    this.assertValid(Validator.name(name), Validator.phone(phone), Validator.email(email));
    const next = { phone: Validator.digits(phone), email: email.trim().toLowerCase() };
    this.store.update((s) => {
      this.assertValid(this.conflict(s, next, this.userId));
      Object.assign(s.users[this.userId], { name: name.trim(), ...next, status: status.trim(), avatar });
    });
  }
}

class Chats {
  constructor(store, fb = null) { this.store = store; this.fb = fb; }
  get users() { return this.store.s.users; }
  find(id) { return id === BOT.id ? BOT : this.users[id] || null; }
  thread(a, b) { return this.store.s.msgs.filter((m) => (m.from === a && m.to === b) || (m.from === b && m.to === a)); }
  send(from, to, text) {
  const msg = { id: uid(), from, to, text: text.trim(), ts: Date.now(), seen: to === BOT.id, synced: false };
  if (!msg.text) return null;
  this.store.update((s) => { s.msgs.push(msg); }); // локально
  
  if (this.fb) {
    this.fb.pushMsg(msg)
      .then(() => this.markSynced(msg.id))
      .catch((e) => console.warn("Firebase send failed:", e.message));
  }
  return msg;
}

markSynced(id) {
  this.store.update((s) => {
    const m = s.msgs.find((x) => x.id === id);
    if (m) m.synced = true;
  });
}
  unread(meId, partnerId) { return this.store.s.msgs.filter((m) => m.to === meId && m.from === partnerId && !m.seen).length; }
  markSeen(meId, partnerId) {
    if (!this.unread(meId, partnerId)) return;
    this.store.update((s) => s.msgs.forEach((m) => { if (m.to === meId && m.from === partnerId) m.seen = true; }));
  }
  /* В списке чатов только те, с кем есть переписка; остальных пользователей находят поиском. */
  partners(meId) {
    const ids = new Set(this.store.s.msgs.flatMap((m) => (m.from === meId ? [m.to] : m.to === meId ? [m.from] : [])));
    return [BOT, ...[...ids].filter((id) => id !== BOT.id).map((id) => this.users[id]).filter(Boolean)];
  }                                               
  async flushUnsynced() {
  if (!this.fb) return;
  const pending = this.store.s.msgs.filter((m) => !m.synced);
  for (const m of pending) {
    try { await this.fb.pushMsg(m); this.markSynced(m.id); }
    catch (e) { console.warn("flush failed:", m.id, e.message); break; }
  }
}
  static matches(u, query) {
    const q = query.trim().toLowerCase(), digits = q.replace(/\D/g, "");
    return u.name.toLowerCase().includes(q) || (u.email || "").includes(q) || (digits.length >= 3 && (u.phone || "").includes(digits));
  }
  search(meId, query) {
    const chats = this.partners(meId), inChats = new Set(chats.map((c) => c.id));
    return {
      chats: chats.filter((c) => Chats.matches(c, query)),
      people: Object.values(this.users).filter((u) => u.id !== meId && !inChats.has(u.id) && Chats.matches(u, query)),
    };
  }
}

class Bot {
  static RULES = [[/привет|здрав/i, "Привет! Я Искра-бот ⚡ Напиши мне что угодно."], [/как дела/i, "Заряжен на 100%! А у тебя?"], [/статус|аватар|имя|номер/i, "Нажми на свою аватарку вверху слева: там статус, фото, имя и номер."]];
  static FALLBACK = ["Принято ⚡", "Интересно! Расскажи ещё.", "Искра уже летит к собеседнику ✨"];
  static reply(text) {
    const rule = Bot.RULES.find(([re]) => re.test(text));
    return rule ? rule[1] : Bot.FALLBACK[Math.floor(Math.random() * Bot.FALLBACK.length)];
  }
}

class AuthView {
  static FIELDS = { name: ["Ваше имя", "text"], phone: ["Номер телефона", "tel"], email: ["Почта (необязательно)", "email"], password: ["Пароль", "password"] };
  /* draft хранит введённое, чтобы переключение «Вход» ↔ «Регистрация» не стирало поля. */
  constructor(auth, onDone, warning = "") {
    Object.assign(this, { auth, onDone, warning, mode: "login", draft: { name: "", phone: "", email: "", password: "" } });
    this.el = h("div", { className: "auth" });
  }
  render() { this.draw(); return this.el; }
  draw() {
    const reg = this.mode === "register";
    const f = Object.fromEntries(Object.entries(AuthView.FIELDS).map(([key, [placeholder, type]]) => {
      const input = field(this.draft[key], placeholder, type);
      input.oninput = () => { this.draft[key] = input.value; };
      return [key, input];
    }));
    const err = h("div", { className: "err" });
    const submit = async () => {
      err.textContent = "";
      try {
        const v = (k) => f[k].value;
        const user = reg ? await this.auth.register({ name: v("name"), phone: v("phone"), email: v("email"), password: v("password") }) : await this.auth.login(v("phone"), v("password"));
        this.onDone(user, reg);
      } catch (e) { err.textContent = e.message; }
    };
    /* Обработчик on* не должен возвращать false: браузер трактует это как preventDefault и блокирует ввод символов. */
    Object.values(f).forEach((input) => { input.onkeydown = (e) => { if (e.key === "Enter") submit(); }; });
    const tab = (mode, label) => h("button", { className: this.mode === mode ? "on" : "", textContent: label, onclick: () => { this.mode = mode; this.draw(); } });
    this.el.replaceChildren(h("div", { className: "card" },
      h("div", { className: "logo", innerHTML: LOGO }),
      h("h1", { textContent: "Искра" }),
      h("p", { className: "sub", textContent: "Общайтесь со скоростью молнии" }),
      h("div", { className: "tabs" }, tab("login", "Вход"), tab("register", "Регистрация")),
      ...(reg ? [f.name, f.phone, f.email, f.password] : [f.phone, f.password]),
      err,
      h("button", { className: "btn", textContent: reg ? "Создать аккаунт" : "Войти", onclick: submit }),
      h("div", { className: "err", textContent: this.warning })));
  }
}

    const rows = chats

    const nodes = thread.flatMap((m) => {

      const out = day === lastDay ? [bubble] : [h("div", { className: "day", textContent: DateFormat.day(m.ts) }), bubble];

    });

    this.headSlot.replaceChildren(avatar(contact, 40), h("div", { className: "t" }, h("b", { textContent: contact.name }), h("small", { textContent: contact.status || "" })));

    this.msgs.scrollTo({ top: this.msgs.scrollHeight, behavior: sameChat ? "smooth" : "auto" });
  }
  syncInput() {
    this.input.style.height = "auto";
    const borders = this.input.offsetHeight - this.input.clientHeight;

    if (this.activeId === BOT.id) setTimeout(() => { this.chats.send(BOT.id, me.id, Bot.reply(text)); this.refresh(); }, 700);
    this.refresh();
  }
}

          h("button", { className: "btn", textContent: "Сохранить", onclick: save })),
        h("div", { className: "sect" }, h("h3", { textContent: "Оформление" }), seg),
        h("div", { className: "sect" }, h("h3", { textContent: "Аккаунт" }), h("button", { className: "btn danger", innerHTML: icon("logout", 18) + "<span>Выйти из аккаунта</span>", onclick: () => this.onLogout() }))));
  }
}

class App {
  constructor(root, store, fb = null) {
  Object.assign(this, { root, store, fb, auth: new Auth(store), chats: new Chats(store, fb), theme: new Theme(store), messenger: null });
  addEventListener("storage", (e) => { if (e.key === KEY) { this.store.load(); this.messenger?.refresh(); } });
}

async startSync() {
  if (!this.fb) return;
  try {
    await this.fb.listenMsgs((msg) => {
      this.store.update((s) => {
        const byId = new Map(s.msgs.map((m) => [m.id, m]));
        const prev = byId.get(msg.id);
        byId.set(msg.id, { ...prev, ...msg, synced: true });
        s.msgs = [...byId.values()];
      });
      this.messenger?.refresh();
    });
    this.chats.flushUnsynced();
  } catch (e) { console.warn("Firebase listen failed:", e.message); }
}
  start() { this.theme.apply(); this.auth.user ? this.showMessenger() : this.showAuth(); }
  mount(node) { node.classList.add("fade"); this.root.replaceChildren(node); }
  showAuth() {
    this.messenger = null;
    this.mount(new AuthView(this.auth, (user, isNew) => {
      if (isNew) this.chats.send(BOT.id, user.id, `Добро пожаловать в Искру, ${user.name}! ⚡ В меню слева вверху: настройки, тема и поиск людей по имени, номеру или почте.`);
      this.showMessenger();
    }, this.store.persistent ? "" : "⚠ Браузер не сохраняет данные: после перезагрузки войти не получится. Откройте Искру по обычной ссылке, а не из файла.").render());
  }
  showMessenger() {
    this.messenger = new MessengerView({ auth: this.auth, chats: this.chats, onSettings: () => this.showSettings(), onLogout: () => this.logout() });
    this.mount(this.messenger.render());
  }
  showSettings() {
    const close = () => { page.classList.remove("shown"); setTimeout(() => page.remove(), 320); };
    const page = new SettingsView({ auth: this.auth, theme: this.theme, onSaved: () => this.messenger.refresh(), onLogout: () => this.logout(), onClose: close }).render();
    this.root.append(page);
    void page.offsetWidth;
    page.classList.add("shown");
  }
  logout() { this.auth.logout(); this.start(); }
}

/* Тесты логики на MemoryBackend: откройте страницу со ссылкой, оканчивающейся на #tests. */
class TestRunner {
  static async run() {
    const out = [], check = (name, ok) => out.push(`${ok ? "✓" : "✗"} ${name}`);
    const rejects = (promise) => promise.then(() => false, () => true);
    const store = new Store(new MemoryBackend()), auth = new Auth(store), chats = new Chats(store);
    check("номер: 8 900… и +7 900… совпадают", Validator.digits("8 900 123-45-67") === Validator.digits("+7 (900) 123-45-67"));
    check("sha256 совпадает с эталоном", sha256("abc") === "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad");
    check("почта: пустая допустима, кривая нет", !Validator.email("") && !!Validator.email("a@b"));
    const anna = await auth.register({ name: "Аня", phone: "+7 900 123 45 67", email: "Anna@Mail.ru", password: "secret1" });
    check("регистрация открывает сессию, почта в нижнем регистре", auth.user?.id === anna.id && anna.email === "anna@mail.ru");
    check("дубликат номера отклонён", await rejects(auth.register({ name: "Борис", phone: "79001234567", password: "secret1" })));
    check("дубликат почты отклонён", await rejects(auth.register({ name: "Борис", phone: "79005554433", email: "anna@mail.ru", password: "secret1" })));
    auth.logout();
    check("выход сбрасывает пользователя", auth.user === null);
    check("неверный пароль отклонён", await rejects(auth.login("79001234567", "wrong-pass")));
    const boris = await auth.register({ name: "Борис", phone: "79005554433", password: "secret2" });
    const found = (q) => chats.search(boris.id, q).people.map((u) => u.name).join();
    check("поиск по имени", found("ан") === "Аня");
    check("поиск по номеру", found("+7 900 123") === "Аня");
    check("поиск по почте", found("anna@") === "Аня");
    chats.send(anna.id, boris.id, "привет");
    check("есть непрочитанное", chats.unread(boris.id, anna.id) === 1);
    chats.markSeen(boris.id, anna.id);
    check("после открытия чата прочитано", chats.unread(boris.id, anna.id) === 0);
    check("собеседник появился в списке чатов", chats.partners(boris.id).some((u) => u.id === anna.id));
    check("пустое сообщение игнорируется", chats.send(anna.id, boris.id, "  ") === null);
    check("даты: сегодня и вчера", DateFormat.day(Date.now()) === "Сегодня" && DateFormat.day(Date.now() - 864e5) === "Вчера");
    const root = { dataset: {}, removeAttribute() { delete this.dataset.theme; } }, theme = new Theme(store);
    theme.set("dark", root);
    check("тема сохраняется и применяется", theme.mode === "dark" && root.dataset.theme === "dark");
    if (typeof document !== "undefined") {
      const keydown = new KeyboardEvent("keydown", { key: "7", cancelable: true });
      new AuthView(auth, () => {}).render().querySelector("input[type=tel]").dispatchEvent(keydown);
      check("клавиша 7 в поле номера не блокируется", !keydown.defaultPrevented);
    }
    return out;
  }
}
